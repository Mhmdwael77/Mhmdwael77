    @keyframes s2 { 0%,9%{opacity:0} 11%,92%{opacity:1} 100%{opacity:0} }
    @keyframes s3 { 0%,18%{opacity:0} 20%,92%{opacity:1} 100%{opacity:0} }
    @keyframes s4 { 0%,28%{opacity:0} 30%,92%{opacity:1} 100%{opacity:0} }
    @keyframes s5 { 0%,38%{opacity:0} 40%,92%{opacity:1} 100%{opacity:0} }
