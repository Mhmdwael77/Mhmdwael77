    @keyframes s8 { 0%,70%{opacity:0} 72%,92%{opacity:1} 100%{opacity:0} }
    .bar { animation: fill 14s ease-out infinite; transform-box: fill-box; transform-origin: left; }
    .b3 { animation-name: f3; } .b4 { animation-name: f4; } .b5 { animation-name: f5; } .b6 { animation-name: f6; }
    @keyframes f3 { 0%,20%{transform:scaleX(0)} 27%,92%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
    @keyframes f4 { 0%,30%{transform:scaleX(0)} 37%,92%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
    @keyframes f5 { 0%,40%{transform:scaleX(0)} 47%,92%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
    @keyframes f6 { 0%,50%{transform:scaleX(0)} 57%,92%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

