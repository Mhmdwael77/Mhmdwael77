<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Training log: Mohamed Wael, ready to build your next AI product">
  <style>
    .t { font: 500 16px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #B7C4CA; }
