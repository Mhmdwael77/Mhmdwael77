    .l1 { animation-name: s1; } .l2 { animation-name: s2; } .l3 { animation-name: s3; } .l4 { animation-name: s4; }
    .l5 { animation-name: s5; } .l6 { animation-name: s6; } .l7 { animation-name: s7; } .l8 { animation-name: s8; }
